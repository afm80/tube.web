name: Build Flutter App (Android APK + Web)

on:
  workflow_dispatch:
  push:
    paths:
      - "app/**"
      - "firebase.json"
      - ".github/workflows/flutter_build.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android and Web platform folders
        run: |
          cp -r lib /tmp/lib_bak
          cp pubspec.yaml /tmp/pubspec_bak.yaml
          flutter create . --platforms=android,web --org app.alfaham --project-name tube
          rm -rf lib test analysis_options.yaml
          cp -r /tmp/lib_bak lib
          cp /tmp/pubspec_bak.yaml pubspec.yaml

      - name: Patch Android manifest (internet, cleartext, app name)
        run: |
          M=android/app/src/main/AndroidManifest.xml
          sed -i 's|android:label="[^"]*"|android:label="Alfaham Tube"|' "$M"
          sed -i 's|<application|<uses-permission android:name="android.permission.INTERNET"/>\n    <application android:usesCleartextTraffic="true"|' "$M"
          sed -i 's|<title>.*</title>|<title>Alfaham Tube</title>|' web/index.html
          sed -i 's|"name": "[^"]*"|"name": "Alfaham Tube"|; s|"short_name": "[^"]*"|"short_name": "Alfaham Tube"|; s|"background_color": "[^"]*"|"background_color": "#000000"|; s|"theme_color": "[^"]*"|"theme_color": "#000000"|' web/manifest.json
          grep -n "applicationId\|namespace" android/app/build.gradle* || true

      - run: flutter pub get

      - name: App icons
        continue-on-error: true
        run: dart run flutter_launcher_icons

      - name: Build APK
        run: flutter build apk --release

      - name: Build Web
        run: flutter build web --release

      - uses: actions/upload-artifact@v4
        with:
          name: alfaham-tube-apk
          path: app/build/app/outputs/flutter-apk/app-release.apk

      - uses: actions/upload-artifact@v4
        with:
          name: alfaham-tube-web
          path: app/build/web

      - name: Deploy web to Firebase Hosting (web.app)
        if: github.ref == 'refs/heads/main'
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: alfaham-tube-web
          channelId: live
          entryPoint: .
