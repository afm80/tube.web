name: alfaham_tube
description: Alfaham Tube
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.0
  google_fonts: ^6.2.0
  url_launcher: ^6.2.0
  youtube_player_iframe: ^5.0.0
  video_player: ^2.8.0
  chewie: ^1.8.0
  flutter_widget_from_html_core: ">=0.15.0 <1.0.0"

dev_dependencies:
  flutter_launcher_icons: ^0.14.1

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon.png"
  adaptive_icon_background: "#000000"
  adaptive_icon_foreground: "assets/icon_fg.png"
  web:
    generate: true
    image_path: "assets/icon.png"
    background_color: "#000000"
    theme_color: "#000000"

flutter:
  uses-material-design: true
  assets:
    - assets/site-logo.png
    - assets/home-icon.png
